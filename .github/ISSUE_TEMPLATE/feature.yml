name: Feature request
description: Describe a capture or recording workflow you would like to improve.
title: "[Feature] "
body:
  - type: textarea
    id: workflow
    attributes:
      label: What are you trying to do?
      description: Describe the task and where the current workflow gets in the way.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a good result look like?
    validations:
      required: true
